{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="wrap error-page">
  <p class="code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="d-flex justify-content-center flex-wrap gap-2">
    <a class="btn btn-ink" href="{{ url_for('main.home') }}">Back to Discover</a>
    <a class="btn btn-line" href="{{ url_for('main.search') }}" data-open-search>Search books</a>
  </div>
</div>
{% endblock %}
